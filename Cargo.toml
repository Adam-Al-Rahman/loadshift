[workspace]
members = [
    "crates/loadshift-domain",
    "crates/loadshift-optimization",
    "crates/loadshift-api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# HTTP
axum = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
] }

# Optimization
highs = "2.4.0"

# Serialization
serde = { version = "1", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
] }

# Optional performance profiling
hotpath = "0.31"

[profile.release]
lto = "thin"
